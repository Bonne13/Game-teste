name: Compilar APK de teste Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/build-android.py'
      - '*.js'
      - '*.css'
      - 'index.html'
      - '.github/workflows/android-test.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar ferramentas do SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regras
        run: |
          for test in economy leagues training match match-rules recovery timeline world drag match-input; do
            node "tests/$test.test.cjs" || exit 1
          done
      - name: Compilar, verificar e assinar APK de desenvolvimento
        run: python3 tools/build-android.py
      - name: Verificar conteúdo offline do APK
        run: python3 tests/android-package.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProximaEstrela-Android-teste
          path: |
            dist/ProximaEstrela-Android-teste.apk
            dist/ProximaEstrela-Android-teste.apk.sha256
